services:
  postgres:
    image: postgres:16-alpine
    container_name: xqcop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-xqcop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-xqcop123}
      POSTGRES_DB: ${DB_NAME:-xqcop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-xqcop} -d ${DB_NAME:-xqcop}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: xqcop-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  flowable:
    image: flowable/flowable-rest:6.8.0
    container_name: xqcop-flowable
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-xqcop}?currentSchema=flowable
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-xqcop}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-xqcop123}
      SPRING_DATASOURCE_DRIVER-CLASS-NAME: org.postgresql.Driver
      FLOWABLE_REST_APP_ADMIN_USER_ID: rest-admin
      FLOWABLE_REST_APP_ADMIN_PASSWORD: test
      FLOWABLE_REST_APP_ADMIN_FIRSTNAME: Rest
      FLOWABLE_REST_APP_ADMIN_LASTNAME: Admin
      FLOWABLE_DATABASE_SCHEMA_UPDATE: "true"
    ports:
      - "${FLOWABLE_PORT:-8080}:8080"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: xqcop-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flowable:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${SERVER_PORT:-3000}
      DATABASE_URL: postgresql://${DB_USER:-xqcop}:${DB_PASSWORD:-xqcop123}@postgres:5432/${DB_NAME:-xqcop}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-it}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      FLOWABLE_URL: http://flowable:8080/flowable-rest
      FLOWABLE_USERNAME: rest-admin
      FLOWABLE_PASSWORD: test
    ports:
      - "${SERVER_PORT:-3000}:3000"
    volumes:
      - ./apps/server/prisma:/app/prisma:ro
    command: >
      sh -c "npx prisma migrate deploy && node dist/main"

volumes:
  postgres_data:
  redis_data:
