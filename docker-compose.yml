services:
  postgres:
    image: postgres:16-alpine
    container_name: xqcop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-xqcop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-xqcop123}
      POSTGRES_DB: ${DB_NAME:-xqcop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-xqcop} -d ${DB_NAME:-xqcop}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: xqcop-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: xqcop-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${SERVER_PORT:-3000}
      DATABASE_URL: postgresql://${DB_USER:-xqcop}:${DB_PASSWORD:-xqcop123}@postgres:5432/${DB_NAME:-xqcop}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-it}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "${SERVER_PORT:-3000}:3000"
    volumes:
      - ./apps/server/prisma:/app/prisma:ro
    command: >
      sh -c "npx prisma migrate deploy && node dist/main"

volumes:
  postgres_data:
  redis_data:
